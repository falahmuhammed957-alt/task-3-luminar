<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-950 text-white">
    <nav class="bg-black justify-between flex">
        <h1 class="text-2xl font-bold text-amber-400">
            Lens and Lights

        </h1>
        <div class="space-x-4">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <section class="text-center py-10">
    <h1 class="text-5xl font-bold text-amber-400">Contact Us</h1>
    <p class="mt-4 text-gray-300">Let's capture your beautiful moments.</p>
</section>
<div class="max-w-xl mx-auto py-6">
    <form class="bg-stone-900 p-8 rounded-lg">
        <label class="block mb-2">Name</label>
        <input type="text" placeholder="Enter your Name" 
        required class="w-full bg-stone-800 rounded mb-3 p-3">
        
        <label class="block mb-2">Email</label>
        <input type="email" placeholder="Enter your email" 
        required class="w-full bg-stone-800 rounded mb-3 p-3">

        <label class="block mb-2">Phone Number</label>
        <input type="tel" placeholder="Enter your Mob No" 
         class="w-full bg-stone-800 rounded mb-3 p-3">

        <label class="block mb-2">Message</label>
        <textarea rows="5" placeholder="Write Your Message"
        required class="w-full bg-stone-800 rounded mb-3 p-3">

        </textarea>
         <button type="submit"
        class="w-full bg-amber-400 text-black p-3 rounded font-bold">
            Send Message
        </button>
        
    </form>

</div>
    <footer class="bg-black text-center p-6 mt-10">
     Lens & Light Photography

    </footer>
</body>
</html>
